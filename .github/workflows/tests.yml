name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # PSScriptAnalyzer and the Pester tests, in Windows PowerShell 5.1 and in PowerShell 7
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: PSScriptAnalyzer
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path .\WinAdminToolkit.ps1 -Severity Warning, Error)
          $findings | Format-Table -Property Severity, Line, RuleName, Message -AutoSize -Wrap | Out-String -Width 250
          if ($findings.Count -gt 0) { throw ('{0} PSScriptAnalyzer finding(s)' -f $findings.Count) }
      - name: Pester
        run: |
          Import-Module -Name Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path .\tests\WinAdminToolkit.Tests.ps1 -Output Detailed -PassThru
          if ($result.Result -ne 'Passed') { throw ('{0} test(s) failed' -f $result.FailedCount) }

  end-to-end:
    # A real run on the throw-away GitHub runner: local accounts, firewall rules, event logs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end test
        shell: powershell
        run: .\tests\e2e.ps1 -ThrowAwayMachine
